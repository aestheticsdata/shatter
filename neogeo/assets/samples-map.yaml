# Every sample in the V-ROM, placed by vromtool.py, which also writes the
# offsets (build/assets/samples.inc) the sound driver plays them from.
# Effects first: an ADPCM-A sample may not cross a 1 MB boundary.
#
# Effects come from tools/gen_sounds.py; the two tracks from src/audio/ by sox.
